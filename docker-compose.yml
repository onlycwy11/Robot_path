version: '3.8'

services:
  # 机器人调度 API 服务
  robot-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-scheduler
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MQTT_HOST=mqtt-broker
    depends_on:
      mqtt-broker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/system/system_status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - scheduler-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MQTT Broker (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2.0.15
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt_config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - scheduler-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mqtt_data:
    driver: local
  mqtt_log:
    driver: local

networks:
  scheduler-network:
    driver: bridge